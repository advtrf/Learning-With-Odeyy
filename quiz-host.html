<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Sesi Quiz — Learning with Odey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EBDA;--paper-light:#FAF5E9;--ink:#2C2416;--ink-soft:#5A5040;--ink-faint:#9A8E7A;
    --herbarium:#4B5D3A;--herbarium-pale:#DCE4D2;--brass:#A9804C;--brass-light:#D4B060;
    --indigo:#3C4A52;--rust:#A6572E;--hairline:rgba(44,36,22,0.18);
    --leather:#3B2A1E;--leather-light:#5A4230;
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;background:radial-gradient(ellipse at center, #3a352e 0%, #211e19 100%);
    color:var(--ink);font-family:'Source Serif 4', serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .book{
    width:100%;max-width:820px;background:var(--paper-light);border-radius:6px;
    box-shadow:0 30px 70px rgba(0,0,0,0.5);overflow:hidden;position:relative;
    padding-left:20px;
  }
  .book::before{
    content:"";position:absolute;top:0;bottom:0;left:0;width:14px;
    background:repeating-linear-gradient(180deg, var(--leather) 0 22px, var(--leather-light) 22px 26px);
    box-shadow:2px 0 12px rgba(0,0,0,0.35) inset;z-index:5;
  }
  .page-inner{padding:32px 36px 30px;}
  .brand-row{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--hairline);}
  .odey-portrait{width:40px;height:40px;border-radius:50%;background:var(--paper);border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .odey-portrait img{width:100%;height:100%;object-fit:cover;}
  .brand-text h1{font-family:'Fraunces', serif;font-size:15px;font-weight:700;margin:0;}
  .back-link{margin-left:auto;font-size:12.5px;font-style:italic;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--hairline);}
  .back-link:hover{color:var(--herbarium);}

  h2.page-title{font-family:'Fraunces', serif;font-weight:700;font-size:26px;text-align:center;margin:28px 0 4px;}
  p.page-sub{text-align:center;font-style:italic;color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}

  /* setup form */
  .setup-card{background:var(--paper);border:1px solid var(--hairline);border-radius:8px;padding:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .set-options{display:flex;gap:10px;}
  .set-btn{
    flex:1;padding:14px;border:1.5px solid var(--hairline);border-radius:6px;background:var(--paper-light);
    cursor:pointer;text-align:center;font-family:'Fraunces', serif;font-size:14px;color:var(--ink-soft);
  }
  .set-btn.selected{border-color:var(--herbarium);background:var(--herbarium-pale);color:var(--herbarium);}
  .create-btn{
    width:100%;padding:13px;border:none;border-radius:6px;background:var(--herbarium);color:var(--paper-light);
    font-family:'Fraunces', serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  .create-btn:hover{background:var(--brass);}
  .create-btn:disabled{opacity:.5;cursor:default;}

  /* session view */
  .session-view{display:none;}
  .room-code-box{
    text-align:center;background:var(--paper);border:1px dashed var(--brass);border-radius:8px;
    padding:22px;margin-bottom:22px;
  }
  .room-code-box .label{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;}
  .room-code-box .code{font-family:'Fraunces', serif;font-size:44px;font-weight:700;letter-spacing:.1em;color:var(--herbarium);margin:6px 0;}
  .room-code-box .hint{font-size:12px;color:var(--ink-faint);font-style:italic;}

  .leaderboard{border:1px solid var(--hairline);border-radius:8px;overflow:hidden;}
  .lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairline);background:var(--paper-light);}
  .lb-row:last-child{border-bottom:none;}
  .lb-row.header{background:var(--paper);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}
  .lb-rank{width:26px;font-family:'Fraunces', serif;font-weight:700;color:var(--brass);}
  .lb-name{flex:1;font-size:14.5px;}
  .lb-progress{font-size:12px;color:var(--ink-soft);width:70px;}
  .lb-score{font-family:'Fraunces', serif;font-weight:700;font-size:16px;color:var(--herbarium);width:60px;text-align:right;}
  .lb-empty{padding:24px;text-align:center;font-style:italic;color:var(--ink-faint);font-size:13.5px;}

  .close-btn{
    margin-top:18px;width:100%;padding:11px;border:1px solid var(--rust);border-radius:6px;
    background:none;color:var(--rust);font-size:13.5px;cursor:pointer;
  }
  .close-btn:hover{background:#f7e9e6;}

  .status-note{text-align:center;font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:14px;}

  /* password gate */
  .pw-card{background:var(--paper);border:1px solid var(--hairline);border-radius:8px;padding:24px;max-width:360px;margin:0 auto;}
  .pw-card input{
    width:100%;padding:11px 14px;border:1.5px solid var(--hairline);border-radius:6px;
    font-family:'Source Serif 4', serif;font-size:15px;background:var(--paper-light);color:var(--ink);
    margin-bottom:12px;
  }
  .pw-card input:focus{outline:none;border-color:var(--herbarium);}
  .pw-error{color:var(--rust);font-size:13px;margin-top:8px;text-align:center;min-height:16px;}
</style>
</head>
<body>

<div class="book">
<div class="page-inner">

  <div class="brand-row">
    <div class="odey-portrait"><img src="assets/odey.png" alt="Odey"></div>
    <div class="brand-text"><h1>Learning with Odey — Mode Guru</h1></div>
    <a class="back-link" href="index.html">&larr; Kembali ke Index</a>
  </div>

  <h2 class="page-title">Buat Sesi Quiz</h2>
  <p class="page-sub">Pilih paket soal, lalu bagikan kode ke siswa</p>

  <div id="passwordGate">
    <div class="pw-card">
      <input type="password" id="pwInput" placeholder="Masukkan password guru" onkeydown="if(event.key==='Enter')checkPassword()">
      <button class="create-btn" onclick="checkPassword()">Masuk</button>
      <div class="pw-error" id="pwError"></div>
    </div>
  </div>

  <div id="setupView" style="display:none;">
    <div class="setup-card">
      <div class="field">
        <label>Pilih paket soal</label>
        <div class="set-options">
          <button class="set-btn selected" id="btnBuku1" onclick="selectSet('buku1')">Buku I<br><small>Tingkat Keanekaragaman Hayati</small></button>
          <button class="set-btn" id="btnBuku2" onclick="selectSet('buku2')">Buku II<br><small>Tipe Ekosistem</small></button>
        </div>
      </div>
      <button class="create-btn" id="createBtn" onclick="createSession()">Buat Sesi &amp; Dapatkan Kode</button>
    </div>
  </div>

  <div class="session-view" id="sessionView">
    <div class="room-code-box">
      <div class="label">Kode Room</div>
      <div class="code" id="roomCodeDisplay">----</div>
      <div class="hint">Siswa masuk lewat quiz.html, masukkan kode ini</div>
    </div>

    <div class="leaderboard">
      <div class="lb-row header">
        <span class="lb-rank">#</span><span class="lb-name">Nama</span><span class="lb-progress">Progress</span><span class="lb-score">Skor</span>
      </div>
      <div id="leaderboardBody"><div class="lb-empty">Menunggu siswa bergabung…</div></div>
    </div>

    <button class="close-btn" onclick="closeSession()">Tutup Sesi</button>
    <p class="status-note" id="statusNote">Sesi aktif — leaderboard diperbarui otomatis</p>
  </div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
  // Ganti dengan firebaseConfig milikmu
  const firebaseConfig = {
    apiKey: "AIzaSyAT4PTFNdUBTvWaD3e9SEMHP2TzYXiydJs",
    authDomain: "learning-with-odeyy.firebaseapp.com",
    databaseURL: "https://learning-with-odeyy-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "learning-with-odeyy",
    storageBucket: "learning-with-odeyy.firebasestorage.app",
    messagingSenderId: "202003210153",
    appId: "1:202003210153:web:7d063b82d18ad805acaeb8"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Ganti password ini ke sesuatu yang cuma kamu tahu.
  // CATATAN: ini bukan keamanan sungguhan (siapa pun bisa lihat lewat "view source"),
  // cuma penghalang ringan supaya siswa tidak iseng buka halaman ini.
  const HOST_PASSWORD = "odey-guru-2026";

  if (sessionStorage.getItem('odey_host_ok') === 'yes') {
    document.getElementById('passwordGate').style.display = 'none';
    document.getElementById('setupView').style.display = 'block';
  }

  window.checkPassword = function() {
    const input = document.getElementById('pwInput').value;
    if (input === HOST_PASSWORD) {
      sessionStorage.setItem('odey_host_ok', 'yes');
      document.getElementById('passwordGate').style.display = 'none';
      document.getElementById('setupView').style.display = 'block';
    } else {
      document.getElementById('pwError').textContent = 'Password salah, coba lagi.';
    }
  };

  let selectedSet = 'buku1';
  let currentRoomCode = null;
  let totalQuestions = 0;

  window.selectSet = function(set) {
    selectedSet = set;
    document.getElementById('btnBuku1').classList.toggle('selected', set === 'buku1');
    document.getElementById('btnBuku2').classList.toggle('selected', set === 'buku2');
  };

  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  window.createSession = async function() {
    const btn = document.getElementById('createBtn');
    btn.disabled = true;
    btn.textContent = 'Membuat sesi…';

    const jsonFile = selectedSet === 'buku1' ? 'quiz-buku1.json' : 'quiz-buku2.json';
    try {
      const res = await fetch(jsonFile);
      const questions = await res.json();
      totalQuestions = questions.length;
    } catch (e) {
      alert('Gagal memuat bank soal: ' + jsonFile + '. Pastikan file ada di folder yang sama.');
      btn.disabled = false;
      btn.textContent = 'Buat Sesi & Dapatkan Kode';
      return;
    }

    const roomCode = generateRoomCode();
    await db.ref('sessions/' + roomCode).set({
      quizSetId: selectedSet,
      status: 'active',
      totalQuestions: totalQuestions,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });

    currentRoomCode = roomCode;
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    document.getElementById('setupView').style.display = 'none';
    document.getElementById('sessionView').style.display = 'block';

    listenLeaderboard(roomCode);
  };

  function listenLeaderboard(roomCode) {
    db.ref('sessions/' + roomCode + '/players').on('value', (snapshot) => {
      const players = snapshot.val() || {};
      const list = Object.values(players).sort((a, b) => (b.score || 0) - (a.score || 0));
      const body = document.getElementById('leaderboardBody');

      if (list.length === 0) {
        body.innerHTML = '<div class="lb-empty">Menunggu siswa bergabung…</div>';
        return;
      }

      body.innerHTML = list.map((p, i) => `
        <div class="lb-row">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(p.name || 'Tanpa nama')}</span>
          <span class="lb-progress">${p.finished ? 'Selesai' : (p.currentQuestion || 0) + '/' + totalQuestions}</span>
          <span class="lb-score">${p.score || 0}</span>
        </div>
      `).join('');
    });
  }

  window.closeSession = async function() {
    if (!currentRoomCode) return;
    if (!confirm('Tutup sesi ini? Siswa baru tidak akan bisa bergabung lagi.')) return;
    await db.ref('sessions/' + currentRoomCode + '/status').set('closed');
    document.getElementById('statusNote').textContent = 'Sesi sudah ditutup — siswa baru tidak bisa bergabung';
  };

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
